<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фон — скруглённый квадрат в акцентном цвете проекта -->
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <!-- Столбцы гистограммы: узнаваемый символ статистики -->
  <g fill="#ffffff">
    <rect x="14" y="34" width="8" height="16" rx="1.5"/>
    <rect x="26" y="24" width="8" height="26" rx="1.5"/>
    <rect x="38" y="16" width="8" height="34" rx="1.5"/>
  </g>
  <!-- Базовая линия -->
  <rect x="12" y="50" width="40" height="2.5" rx="1.25" fill="#ffffff" opacity="0.7"/>
</svg>
